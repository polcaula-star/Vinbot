<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f9fc" />
    <meta name="description" content="Guías breves y visuales para organizar tu operativa con Vinbot." />
    <script>
      (() => {
        const supported = ['es', 'ca', 'en', 'fr'];
        const requested = new URLSearchParams(location.search).get('lang');
        const locale = supported.includes(requested) ? requested : 'es';
        document.documentElement.lang = locale;
        if (locale !== 'es') document.documentElement.classList.add('i18n-loading');
      })();
    </script>
    <style>.i18n-loading body { visibility: hidden; }</style>
    <link rel="icon" href="/assets/Monograma%20VB%20blanco%20sobre%20azul%20vivo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/guide/guide.css" />
    <title>Guía Vinbot</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/guide/guide.js" defer></script>
  </head>
  <body>
    <header class="guide-header">
      <a class="guide-brand" href="/?lang=es" aria-label="Vinbot, inicio">
        <img src="/assets/Monograma%20VB%20blanco%20sobre%20azul%20vivo.png" alt="" width="34" height="34" />
        <span>vinbot</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span data-copy="guide_label">Guía</span>
      </a>
      <div class="header-actions">
        <div class="language-switcher" data-language-switcher>
          <button class="language-trigger" type="button" aria-label="Cambiar idioma" aria-haspopup="menu" aria-expanded="false">
            <img data-current-flag src="/assets/flags/es.svg" alt="" width="18" height="13" />
            <span data-current-language>Español</span>
            <i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>
          <div class="language-menu" role="menu" hidden>
            <button type="button" role="menuitemradio" data-locale="es" aria-checked="false"><img src="/assets/flags/es.svg" alt="" width="18" height="13" /><span>Español</span><i data-lucide="check" aria-hidden="true"></i></button>
            <button type="button" role="menuitemradio" data-locale="ca" aria-checked="false"><img src="/assets/flags/ca.svg" alt="" width="18" height="13" /><span>Català</span><i data-lucide="check" aria-hidden="true"></i></button>
            <button type="button" role="menuitemradio" data-locale="en" aria-checked="false"><img src="/assets/flags/en.svg" alt="" width="18" height="13" /><span>English</span><i data-lucide="check" aria-hidden="true"></i></button>
            <button type="button" role="menuitemradio" data-locale="fr" aria-checked="false"><img src="/assets/flags/fr.svg" alt="" width="18" height="13" /><span>Français</span><i data-lucide="check" aria-hidden="true"></i></button>
          </div>
        </div>
        <a class="access-button" href="https://start.vinbot.app/" data-copy="access_label">Solicitar acceso anticipado</a>
      </div>
    </header>
    <main id="guide-app" class="guide-shell" aria-live="polite">
      <div class="loading-line" aria-hidden="true"></div>
    </main>
    <footer class="guide-footer">
      <a href="/?lang=es" data-copy="home_label">Inicio</a>
      <p data-copy="legal_notice">Vinbot es un servicio independiente y no está afiliado, asociado ni respaldado por Vinted.</p>
    </footer>
  </body>
</html>
